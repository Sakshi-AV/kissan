<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Kissan Cart | Direct Agricultural Portal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboards.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at top right, var(--color-green-50), var(--bg-secondary));
    }
    .auth-card-wide {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.75rem;
      width: 100%;
      max-width: 620px;
      box-shadow: var(--shadow-xl);
    }
    .role-selector-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .role-btn-card {
      border: 2px solid var(--border-color);
      background-color: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .role-btn-card:hover {
      border-color: var(--color-green-500);
    }
    .role-btn-card.active {
      border-color: var(--color-green-600);
      background-color: var(--color-green-50);
      color: var(--color-green-800);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
    }
    .role-btn-icon {
      font-size: 1.75rem;
      color: var(--color-green-600);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-seedling"></i></div>
        <div class="brand-text">
          <span class="brand-name">Kissan<span>Cart</span></span>
          <span class="brand-sub" data-i18n="tagline">From Our Farms to Your Homes</span>
        </div>
      </a>

      <div class="nav-actions">
        <div class="lang-selector-wrapper">
          <i class="fa-solid fa-globe lang-globe-icon"></i>
          <select id="languageSelect" class="lang-select">
            <option value="en">English</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="hi">हिन्दी (Hindi)</option>
          </select>
          <i class="fa-solid fa-chevron-down lang-arrow"></i>
        </div>

        <button id="themeToggle" class="btn-icon-toggle"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <!-- Auth Content -->
  <main class="auth-page-wrapper">
    <div class="auth-card-wide">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--text-primary);" data-i18n="register_title">Create Kissan Cart Account</h2>
        <p style="font-size: 0.95rem; color: var(--text-muted); margin-top: 0.25rem;" data-i18n="register_subtitle">Join India's direct farm-to-consumer revolution</p>
      </div>

      <!-- Role Selection -->
      <label class="form-label" style="text-align: center; margin-bottom: 0.75rem;" data-i18n="role_label">Choose Account Role</label>
      <div class="role-selector-row">
        
        <div class="role-btn-card active" id="roleCustomerCard" onclick="selectRole('customer')">
          <i class="fa-solid fa-cart-shopping role-btn-icon"></i>
          <strong style="font-size: 1rem;" data-i18n="role_customer">Customer / Buyer</strong>
          <span style="font-size: 0.78rem; color: var(--text-muted);">Purchase fresh produce directly</span>
        </div>

        <div class="role-btn-card" id="roleFarmerCard" onclick="selectRole('farmer')">
          <i class="fa-solid fa-tractor role-btn-icon"></i>
          <strong style="font-size: 1rem;" data-i18n="role_farmer">Farmer / Seller</strong>
          <span style="font-size: 0.78rem; color: var(--text-muted);">List crops & receive direct orders</span>
        </div>

      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <input type="hidden" id="selectedRoleInput" value="customer" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" data-i18n="full_name">Full Name *</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Ramesh Patel" required />
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="email_label">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" data-i18n="password_label">Password * (Min 6 characters)</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required />
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="phone_number">Phone Number *</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+91 98765 43210" required />
          </div>
        </div>

        <!-- Farmer specific fields -->
        <div id="farmerExtraFields" style="display: none; background-color: var(--color-green-50); padding: 1.25rem; border-radius: var(--radius-md); border: 1px dashed var(--color-green-500); margin-bottom: 1.25rem;">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; color: var(--color-green-800); font-weight: 700;">
            <i class="fa-solid fa-seedling"></i>
            <span>Farmer Farm Profile</span>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="farm_name">Farm Name / Enterprise</label>
            <input type="text" id="regFarmName" class="form-control" placeholder="e.g. Kaveri Organic Fields" />
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" data-i18n="farm_address">Farm Location & Village</label>
            <input type="text" id="regFarmAddress" class="form-control" placeholder="e.g. Biligere Village, Mandya Taluk" />
          </div>
        </div>

        <!-- Location Fields -->
        <div class="form-group">
          <label class="form-label" data-i18n="street_address">Street Address / House No.</label>
          <input type="text" id="regAddress" class="form-control" placeholder="Street / Village / Area" />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" data-i18n="city">City / District</label>
            <input type="text" id="regCity" class="form-control" placeholder="Mandya" />
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="state">State</label>
            <input type="text" id="regState" class="form-control" placeholder="Karnataka" />
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="pincode">PIN Code</label>
            <input type="text" id="regPincode" class="form-control" placeholder="571401" />
          </div>
        </div>

        <button type="submit" id="submitRegisterBtn" class="btn btn-primary btn-lg btn-block" style="margin-top: 1rem;">
          <i class="fa-solid fa-user-plus"></i>
          <span data-i18n="btn_register">Create Account</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        <span data-i18n="already_have_account">Already have an account?</span>
        <a href="/login.html" style="color: var(--color-green-600); font-weight: 700; margin-left: 0.25rem;">Sign in</a>
      </div>

    </div>
  </main>

  <script src="js/translations.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('role') === 'farmer') {
        selectRole('farmer');
      }
    });

    function selectRole(role) {
      document.getElementById('selectedRoleInput').value = role;
      const custCard = document.getElementById('roleCustomerCard');
      const farmCard = document.getElementById('roleFarmerCard');
      const farmExtra = document.getElementById('farmerExtraFields');

      if (role === 'farmer') {
        farmCard.classList.add('active');
        custCard.classList.remove('active');
        farmExtra.style.display = 'block';
      } else {
        custCard.classList.add('active');
        farmCard.classList.remove('active');
        farmExtra.style.display = 'none';
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('selectedRoleInput').value;
      const btn = document.getElementById('submitRegisterBtn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      const payload = {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        phone: document.getElementById('regPhone').value.trim(),
        role: role,
        address: document.getElementById('regAddress').value.trim(),
        city: document.getElementById('regCity').value.trim(),
        state: document.getElementById('regState').value.trim(),
        pincode: document.getElementById('regPincode').value.trim(),
      };

      if (role === 'farmer') {
        payload.farmName = document.getElementById('regFarmName').value.trim();
        payload.farmAddress = document.getElementById('regFarmAddress').value.trim();
      }

      try {
        const data = await auth.register(payload);
        showToast('Account created successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = auth.getDashboardUrl(data.user.role);
        }, 800);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    }
  </script>
</body>
</html>
